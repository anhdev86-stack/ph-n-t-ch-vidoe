<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Affiliate</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-logo" data-icon="brand"></span> Kaloclip</div>
    <nav class="nav">
      <a class="nav-item" href="/"><span class="ic" data-icon="clapper"></span> Video sang Storyboard</a>
      <a class="nav-item active"><span class="ic" data-icon="video"></span> Video Affiliate</a>
      <a class="nav-item"><span class="ic" data-icon="pen"></span> Trình viết kịch bản AI</a>
      <a class="nav-item"><span class="ic" data-icon="share"></span> Đăng TikTok</a>
    </nav>
    <div class="sidebar-bottom">
      <a class="nav-item"><span class="ic" data-icon="folder"></span> Thư viện</a>
      <div class="credits"><span class="diamond" data-icon="gem"></span> <span>78.1</span></div>
      <div class="user"><span class="avatar">H</span><span class="uname">Huyền Đào Thị T…</span><span class="chev" data-icon="chevron"></span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 class="title">Video Affiliate gắn sản phẩm shop</h1>
      <button class="btn ghost" id="reload" style="margin-left:auto">↻ Tải lại</button>

    <div class="videos-wrap">
      <div id="banner" class="banner hidden"></div>
      <div id="grid" class="grid"></div>
      <div id="more-wrap" class="more-wrap hidden"><button class="btn ghost" id="more">Tải thêm</button></div>
    </div>
  </main>

<script src="/static/videos.js"></script>
